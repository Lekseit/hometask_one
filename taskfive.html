<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка делимости</title>
</head>
<body>
<script>
    // Запрос двух чисел у пользователя
    let xInput = prompt('Введите первое число (делимое):');
    let yInput = prompt('Введите второе число (делитель):');

    // Преобразование введённых значений в числа
    let x = Number(xInput);
    let y = Number(yInput);

    // Проверка, являются ли введённые значения числами
    if (isNaN(x) || isNaN(y)) {
        alert('Ошибка: оба значения должны быть числами!');
    } else if (y === 0) {
        alert('Ошибка: деление на ноль невозможно!');
    } else {
        // Проверка делимости
        if (x % y === 0) {
            alert('Число ' + x + ' делится на ' + y + ' без остатка.');
        } else {
            let remainder = x % y;
            alert('Число ' + x + ' не делится на ' + y + '. Остаток: ' + remainder + '.');
        }
    }
</script>
</body>
</html>
