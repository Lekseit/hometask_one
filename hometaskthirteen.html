<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подсчёт символов</title>
</head>
<body>
<script>
    let totalChars = 0; // Общее количество символов
    let input;

    // Цикл для ввода строк
    while (true) {
        input = prompt('Введите строку (для завершения введите "стоп"):', '');

        // Проверка на отмену ввода
        if (input === null) {
            break;
        }

        // Преобразуем ввод в нижний регистр для сравнения
        if (input.toLowerCase() === 'стоп') {
            break;
        }

        // Удаляем пробелы и подсчитываем символы
        let charsInString = input.replace(/\s/g, '').length;
        totalChars += charsInString;

        alert('В этой строке ' + charsInString + ' символов (без пробелов).');
    }

    // Выводим общее количество символов
    alert('Общее количество символов во всех строках (без пробелов): ' + totalChars);
</script>
</body>
</html>
