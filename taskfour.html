<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка возраста</title>
</head>
<body>
<script>
    // Запрос имени пользователя
    let name = prompt('Введите ваше имя:');

    // Запрос возраста и преобразование в число
    let age = prompt('Введите ваш возраст:');
    let ageNumber = Number(age);

    // Проверка, является ли возраст числом
    if (isNaN(ageNumber)) {
        alert('Ошибка: возраст должен быть числом!');
    } else {
        alert('Привет, ' + name + '! Тебе ' + ageNumber + ' лет.');
    }
</script>
</body>
</html>
