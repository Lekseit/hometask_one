<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Визитка</title>
  <!-- Подключение Font Awesome через CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Основной шрифт Arial или без засечек */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
    }

    /* Стили для изображения */
    .profile-photo {
      width: 150px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 5px;
      color: #333;
    }

    p {
      margin: 10px 0;
      color: #555;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 8px 0;
    }

    .contact-icon {
      width: 20px;
      text-align: center;
      color: #007bff;
    }
  </style>
</head>
<body>
  <!-- Изображение -->
  <img src="https://cdn.stocksnap.io/img-thumbs/960w/laptop-working_HB4IJY3TPI.jpg"
       alt="Фото профиля"
       class="profile-photo">

  <!-- Заголовок -->
  <h1>Иван Иванов</h1>

  <!-- Должность -->
  <p>Веб-разработчик</p>

  <!-- Контактный телефон -->
  <p class="contact-item">
    <span class="contact-icon"><i class="fas fa-phone"></i></span>
    +123 456 7890
  </p>

  <!-- Email -->
  <p class="contact-item">
    <span class="contact-icon"><i class="fas fa-envelope"></i></span>
    example@email.com
  </p>

  <!-- GitHub профиль -->
  <p class="contact-item">
    <span class="contact-icon"><i class="fas fa-github"></i></span>
    <a href="https://github.com/yourprofile" style="color: inherit; text-decoration: none;">GitHub Profile</a>
  </p>
</body>
</html>
