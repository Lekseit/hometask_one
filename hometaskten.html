<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка товара</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f9f9f9;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .product-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 300px;
      text-align: center;
      padding: 20px;
    }

    .product-card img {
      width: 100%;
      border-radius: 8px;
    }

    .product-card h2 {
      font-size: 1.5rem;
      margin: 15px 0;
    }

    .product-card p {
      font-size: 1rem;
      color: #555;
    }

    .price {
      color: #e74c3c;
      font-size: 1.2rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="product-card">
    <img src="https://cdn.stocksnap.io/img-thumbs/960w/empty-chair_FA9DQJTALM.jpg" alt="Изображение товара">
    <h2>Название товара: Стул-винтаж</h2>
    <p>Краткое описание товара: стул, винтаж - это непросто стул, это нечто!</p>
    <div class="price">Цена: 1000 ₽</div>
  </div>
</body>
</html>
